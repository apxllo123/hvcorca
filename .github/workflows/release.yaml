name: Publish Release

on:
  workflow_dispatch:
  release:
    types: [ published, prereleased ]
    
permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
    - name: GitHub Checkout
      uses: actions/checkout@v4

    - name: Setup PNPM
      uses: pnpm/action-setup@v4
      with:
        version: 7.33.7  # Matches pnpm-lock.yaml lockfileVersion 5.4

    - name: Setup Foreman
      uses: rojo-rbx/setup-foreman@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Add Foreman tools to PATH
      run: echo "$HOME/.foreman/bin" >> "$GITHUB_PATH"

    - name: Install Rojo and Remodel
      run: foreman install
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20  # LTS (18 EOL), supports eslint 9.x
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile  # Strict CI matching

    - name: Resolve version tag
      id: version
      run: |
        TAG="${{ github.event.release.tag_name }}"
        if [ -z "$TAG" ]; then
          TAG="v$(date +%Y%m%d-%H%M)"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Build & Compile
      run: |
        pnpm run build --verbose
        pnpm run rojo --verbose
      
    - name: Bundle Luau
      run: |
        pnpm run bundle:prod
        pnpm run bundle:dev
      
    - name: Commit artifacts
      uses: EndBug/add-and-commit@v9
      with:
        add: '["dist/main.rbxm", "dist/main.lua", "dist/main-dev.lua"]'  # Fixed paths
        message: "🐋 Release ${{ steps.version.outputs.tag }}"
        
    - name: Upload Release Assets
      uses: alexellis/upload-assets@0.4.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        asset_paths: '["dist/main.rbxm", "dist/main.lua", "dist/main-dev.lua"]'
