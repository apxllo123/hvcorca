name: Publish Release

on:
  workflow_dispatch:
  release:
    types: [ published, prereleased ]
    
permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
    - name: GitHub Checkout
      uses: actions/checkout@v4

    - name: Setup PNPM
      uses: pnpm/action-setup@v4
      with:
        version: 7.33.7  # Matches pnpm-lock.yaml lockfileVersion 5.4

    - name: Install release tools
      run: |
        curl --fail --location --silent --show-error --output /tmp/foreman.zip https://github.com/Roblox/foreman/releases/download/v1.7.0/foreman-linux-x86_64.zip
        unzip -q /tmp/foreman.zip -d /tmp/foreman
        install /tmp/foreman/foreman /usr/local/bin/foreman
        foreman install
        RUSTFLAGS="--cap-lints allow" cargo install --git https://github.com/rojo-rbx/remodel --tag v0.11.0 --locked remodel
        echo "$HOME/.foreman/bin" >> "$GITHUB_PATH"
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20  # LTS (18 EOL), supports eslint 9.x
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile  # Strict CI matching

    - name: Resolve version tag
      id: version
      run: |
        TAG="${{ github.event.release.tag_name }}"
        if [ -z "$TAG" ]; then
          TAG="v$(date +%Y%m%d-%H%M)"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Build & Compile
      run: |
        pnpm run build --verbose
        pnpm run rojo --verbose
      
    - name: Bundle Luau
      run: |
        pnpm run rojo
        pnpm exec cross-env ENV=production remodel run ci/bundle.lua dist/main.lua "${{ steps.version.outputs.tag }}"
        pnpm exec cross-env ENV=development remodel run ci/bundle.lua dist/main-dev.lua "${{ steps.version.outputs.tag }}" debug

    - name: Verify bundle
      run: pnpm run verify:bundle
      
    - name: Publish latest Lua bundles
      run: |
        cp dist/main.lua public/latest.lua
        cp dist/main-dev.lua public/latest.debug.lua

    - name: Commit artifacts
      uses: EndBug/add-and-commit@v9
      with:
        add: public/latest.lua public/latest.debug.lua dist/main.rbxm dist/main.lua dist/main-dev.lua
        message: "🐋 Release ${{ steps.version.outputs.tag }}"
        
    - name: Upload Release Assets
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
        fi
        gh release upload "$RELEASE_TAG" dist/main.rbxm dist/main.lua dist/main-dev.lua --clobber
