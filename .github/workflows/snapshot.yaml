name: Publish Nightly Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  bundle-snapshot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7  # Matches pnpm-lock.yaml lockfileVersion 5.4

      - name: Install release tools
        run: |
          curl --fail --location --silent --show-error --output /tmp/foreman.zip https://github.com/Roblox/foreman/releases/download/v1.7.0/foreman-linux-x86_64.zip
          unzip -q /tmp/foreman.zip -d /tmp/foreman
          install /tmp/foreman/foreman /usr/local/bin/foreman
          foreman install
          RUSTFLAGS="--cap-lints allow" cargo install --git https://github.com/rojo-rbx/remodel --tag v0.11.0 --locked remodel
          echo "$HOME/.foreman/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile roblox-ts
        run: pnpm run build

      - name: Build model
        run: pnpm run rojo

      - name: Get snapshot tag
        id: date
        run: echo "tag=nightly-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Bundle snapshot
        run: |
          pnpm exec remodel run ci/bundle.lua public/snapshot.lua ${{ steps.date.outputs.tag }}
          pnpm exec remodel run ci/bundle.lua public/snapshot.debug.lua ${{ steps.date.outputs.tag }} debug

      - name: Verify bundle
        run: node ci/verify-bundle.mjs public/snapshot.lua public/snapshot.debug.lua

      - name: Commit nightly snapshot
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          add: "['public/snapshot.lua', 'public/snapshot.debug.lua']"
          message: "🔥 Nightly snapshot ${{ steps.date.outputs.tag }}"
